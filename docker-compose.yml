name: calculator

services:
  calculator-service:
    build:
      context: ./backend
    environment:
      PORT: "8080"
      LOG_LEVEL: info
      SHUTDOWN_TIMEOUT: 10s
    expose:
      - "8080"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - calculator-service
    restart: unless-stopped
